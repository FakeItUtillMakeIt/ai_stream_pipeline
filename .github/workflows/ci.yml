name: build-matrix

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux-cpu:
    # 纯 CPU 基线：所有平台相关代码必须能在无 CUDA 环境编译
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev libavcodec-dev \
            libavformat-dev libavutil-dev libswscale-dev libspdlog-dev \
            nlohmann-json3-dev libeigen3-dev libcurl4-openssl-dev libgtest-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-cuda:
    # CUDA 编译验证（CI 无 GPU，仅验证可编译性）
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.6.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake g++ git libopencv-dev libavcodec-dev \
            libavformat-dev libavutil-dev libswscale-dev nlohmann-json3-dev \
            libeigen3-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=ON
      - name: Build
        run: cmake --build build -j$(nproc)

  linux-aarch64-rknn:
    # RK3588 交叉编译（真实 arm64 sysroot）：验证 RKNN 后端 + 完整依赖链
    # 在 aarch64 目标下可编译。构建期仅头文件/链接，不运行测试（无 qemu 执行）。
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host cross toolchain + debootstrap
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static g++-aarch64-linux-gnu
      - name: Bootstrap aarch64 sysroot (jammy)
        run: |
          sudo debootstrap --arch=arm64 --variant=minbase jammy /opt/rk3588-sysroot \
            http://ports.ubuntu.com/ubuntu-ports
          sudo cp /usr/bin/qemu-aarch64-static /opt/rk3588-sysroot/usr/bin/
          echo "deb http://ports.ubuntu.com/ubuntu-ports jammy main universe" | \
            sudo tee /opt/rk3588-sysroot/etc/apt/sources.list
      - name: Install target dependencies into sysroot
        run: |
          sudo chroot /opt/rk3588-sysroot /usr/bin/qemu-aarch64-static /bin/sh -c \
            "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y \
             libopencv-dev libavcodec-dev libavformat-dev libavutil-dev \
             libswscale-dev libspdlog-dev nlohmann-json3-dev libeigen3-dev \
             libcurl4-openssl-dev liblapack-dev libblas-dev"
      - name: Configure (repo toolchain + RKNN)
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-rk3588.toolchain.cmake \
            -DRK3588_SYSROOT=/opt/rk3588-sysroot \
            -DRK_TOOLCHAIN_PREFIX=/usr/bin/aarch64-linux-gnu- \
            -DWITH_RKNN=ON -DWITH_CUDA=OFF -DWITH_TENSORRT=OFF -DWITH_ASCEND=OFF \
            -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j$(nproc)
