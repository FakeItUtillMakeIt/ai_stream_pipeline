name: build-matrix

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  linux-cpu:
    # 纯 CPU 基线：所有平台相关代码必须能在无 CUDA 环境编译
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopencv-dev libavcodec-dev \
            libavformat-dev libavutil-dev libswscale-dev libspdlog-dev \
            nlohmann-json3-dev libeigen3-dev libcurl4-openssl-dev libgtest-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-cuda:
    # CUDA 编译验证（CI 无 GPU，仅验证可编译性）
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.6.0-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake g++ git libopencv-dev libavcodec-dev \
            libavformat-dev libavutil-dev libswscale-dev nlohmann-json3-dev \
            libeigen3-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=ON
      - name: Build
        run: cmake --build build -j$(nproc)

  linux-aarch64:
    # ARM64 交叉编译：验证可移植代码在非 x86 架构无编译错误（不含 CUDA/TRT）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain and dependencies (arm64)
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main universe" | \
            sudo tee /etc/apt/sources.list.d/ports.list
          sudo apt-get update || true
          sudo apt-get install -y g++-aarch64-linux-gnu
      - name: Configure (cross, no optional backends)
        run: |
          cat > toolchain.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR aarch64)
          set(CMAKE_C_COMPILER aarch64-linux-gnu-gcc)
          set(CMAKE_CXX_COMPILER aarch64-linux-gnu-g++)
          set(CMAKE_FIND_ROOT_PATH /usr/aarch64-linux-gnu)
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_CUDA=OFF -DWITH_TENSORRT=OFF -DWITH_RKNN=OFF -DWITH_ASCEND=OFF
      - name: Build
        run: cmake --build build -j$(nproc)
